# The docs site deployment (T4.8, decision D10): plain Markdown on GitHub
# Pages — no site framework, no node_modules. Every push that touches the
# docs rebuilds the site (the builder also fails the run on a dead link)
# and deploys it. The source Markdown stays under docs/ for review; this
# workflow only renders it.

name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "docs-site/**", "src/cli.emo"]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the renderer
        run: pip install markdown
      - name: Warn when the routed commands drifted from the CLI reference
        run: |
          # The route table in src/cli.emo vs the reference's command list
          # (test/cli.emo's snapshot pins the same surface for emo test).
          routed="$(grep -oE '^    "[a-z]+" then \{ return' src/cli.emo | grep -oE '"[a-z]+"' | tr -d '"' | sort -u || true)"
          documented="$(grep -E '^\| [a-z]+ \|' docs/reference/cli.md | awk -F'|' '{print $2}' | tr -d ' ' | sort -u || true)"
          drift="$(comm -23 <(echo "$routed") <(echo "$documented") | tr '\n' ' ')"
          if [ -n "$drift" ]; then
            echo "::warning file=docs/reference/cli.md::routed commands missing from the CLI reference: $drift"
          fi
      - name: Validate the examples against the JSON Schemas
        run: python3 docs/schema/validate.py
      - name: Build the site (fails on dead links)
        run: python3 docs-site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
