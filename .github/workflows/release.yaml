# The release workflow (T4.7): a v* tag builds the CLI and the registry for
# the three release platforms, publishes the tarballs with a checksums.txt,
# and cuts the GitHub Release the install script (install.sh) downloads
# from. Each platform builds natively on its runner — no cross-compilation,
# no emulation.
#
# The Emo toolchain is built from source on every runner: the release needs
# compiler fixes that are not in a published emo release (the TLS
# reachability walk and the plain-send would-block retry), and the Linux
# binary release predates them. EMO_REF pins the commit both platforms use.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release itself is the only write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-amd64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-latest, platform: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      # The emo commit the binaries are built with. It must be reachable
      # from github.com/emo-lang/emo: opam pins by full SHA, so a local-only
      # commit fails the checkout.
      EMO_REF: 63e2f00950e38cc386ec08fc468087c4b0fedcd2
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5.0
          opam-disable-sandboxing: true

      - name: Install the Emo toolchain (opam)
        run: |
          opam pin add emo.dev "git+https://github.com/emo-lang/emo.git#${EMO_REF}" --yes
          opam install emo.dev --yes
          echo "$(opam var bin)" >> "$GITHUB_PATH"
          opam exec -- emo version

      - name: Install libsqlite3 and OpenSSL (the registry and the TLS client link them)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev
      - name: Install libsqlite3 and OpenSSL
        if: runner.os == 'macOS'
        run: |
          brew install sqlite openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix sqlite)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build
        run: |
          mkdir -p bin
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            extra=(--cclib="-L$(brew --prefix openssl@3)/lib")
          fi
          emo build "${extra[@]}" -o ./bin/pokerface main.emo
          emo build "${extra[@]}" -o ./bin/pokerface-registry ./registry/main.emo

      - name: Bundle OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ssl_old="$(otool -L bin/pokerface | awk '/libssl.*\.dylib/ {print $1; exit}')"
          crypto_old="$(otool -L bin/pokerface | awk '/libcrypto.*\.dylib/ {print $1; exit}')"
          ssl_name="$(basename "$ssl_old")"
          crypto_name="$(basename "$crypto_old")"
          cp "$ssl_old" "$crypto_old" bin/
          for f in bin/pokerface bin/pokerface-registry; do
            install_name_tool -change "$ssl_old" "@executable_path/$ssl_name" "$f"
            install_name_tool -change "$crypto_old" "@executable_path/$crypto_name" "$f"
          done
          install_name_tool -id "@executable_path/$ssl_name" "bin/$ssl_name"
          install_name_tool -id "@executable_path/$crypto_name" "bin/$crypto_name"
          # libssl's own libcrypto reference can be the Cellar path, not the
          # opt symlink the executable records: rewrite what it actually says.
          crypto_in_ssl="$(otool -L "bin/$ssl_name" | awk '/libcrypto.*\.dylib/ {print $1; exit}')"
          install_name_tool -change "$crypto_in_ssl" "@executable_path/$crypto_name" "bin/$ssl_name"
          # install_name_tool invalidates the code signature; arm64 refuses
          # modified binaries until they are signed again (ad hoc is enough).
          codesign --force --sign - bin/pokerface bin/pokerface-registry "bin/$ssl_name" "bin/$crypto_name"

      - name: Package
        run: |
          names=(pokerface pokerface-registry)
          if [ "$RUNNER_OS" = "macOS" ]; then
            for lib in bin/libssl.*.dylib bin/libcrypto.*.dylib; do
              names+=("$(basename "$lib")")
            done
          fi
          tar -czf "pokerface-${{ matrix.platform }}.tar.gz" -C bin "${names[@]}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "pokerface-${{ matrix.platform }}.tar.gz" > "pokerface-${{ matrix.platform }}.sha256"
          else
            shasum -a 256 "pokerface-${{ matrix.platform }}.tar.gz" > "pokerface-${{ matrix.platform }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pokerface-${{ matrix.platform }}
          path: |
            pokerface-${{ matrix.platform }}.tar.gz
            pokerface-${{ matrix.platform }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Combine the checksums
        working-directory: dist
        run: cat *.sha256 > checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "pokerface $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*
