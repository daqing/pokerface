# The release workflow (T4.7): a v* tag builds the CLI and the registry for
# the three release platforms, publishes the tarballs with a checksums.txt,
# and cuts the GitHub Release the install script (install.sh) downloads
# from. Each platform builds natively on its runner — no cross-compilation,
# no emulation.
#
# The Emo toolchain is the published binary release on Linux; the macOS
# archive is built for a newer macOS than the runners provide (dyld cannot
# find _dup3), so macOS builds the compiler from source with opam.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release itself is the only write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-amd64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-latest, platform: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      # The published toolchain release the Linux binaries are built with; a
      # tag rebuilds with the same compiler.
      EMO_VERSION: v0.26.1120.1
      # The compiler commit behind EMO_VERSION; macOS builds it from source.
      EMO_REF: 2d94fcec9a07d72d048bff5c5264d3cd655c21c5
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml (macOS builds the toolchain from source)
        if: runner.os == 'macOS'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5.0
          opam-disable-sandboxing: true

      - name: Install the Emo toolchain (opam, macOS)
        if: runner.os == 'macOS'
        run: |
          opam pin add emo.dev "git+https://github.com/emo-lang/emo.git#${EMO_REF}" --yes
          opam install emo.dev --yes
          echo "$(opam var bin)" >> "$GITHUB_PATH"
          opam exec -- emo version

      - name: Install the Emo toolchain (binary)
        if: runner.os == 'Linux'
        env:
          EMO_PREFIX: ${{ runner.temp }}/emo
        run: |
          # The prefix is on PATH first, so the installer skips the shell-rc edit.
          export PATH="$EMO_PREFIX/bin:$PATH"
          curl -fsSL https://www.emo-lang.cn/cdn/install.sh | sh
          echo "$EMO_PREFIX/bin" >> "$GITHUB_PATH"
          "$EMO_PREFIX/bin/emo" version

      - name: Install libsqlite3 (the registry links it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install libsqlite3 (the registry links it)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite
          echo "PKG_CONFIG_PATH=$(brew --prefix sqlite)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build
        run: |
          mkdir -p bin
          emo build -o ./bin/pokerface main.emo
          emo build -o ./bin/pokerface-registry ./registry/main.emo

      - name: Package
        run: |
          tar -czf "pokerface-${{ matrix.platform }}.tar.gz" -C bin pokerface pokerface-registry
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "pokerface-${{ matrix.platform }}.tar.gz" > "pokerface-${{ matrix.platform }}.sha256"
          else
            shasum -a 256 "pokerface-${{ matrix.platform }}.tar.gz" > "pokerface-${{ matrix.platform }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pokerface-${{ matrix.platform }}
          path: |
            pokerface-${{ matrix.platform }}.tar.gz
            pokerface-${{ matrix.platform }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Combine the checksums
        working-directory: dist
        run: cat *.sha256 > checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "pokerface $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*
