# Registry service configuration (T2.1).
# Copy to ./registry.yaml, or pass this file with --config.

listen:
  host: 127.0.0.1
  port: 5000

data_dir: ./data

# The SQLite metadata database (T2.2). Optional; defaults to
# <data_dir>/registry.db.
# db_path: ./data/registry.db

store:
  backend: fs
  root: ./data/blobs

# S3 / MinIO backend (T2.6). Set store.backend: s3 to use it; keep the keys
# in POKERFACE_REGISTRY_S3_ACCESS_KEY / _SECRET_KEY rather than this file.
#  s3:
#    endpoint: http://127.0.0.1:9000
#    bucket: pokerface
#    region: us-east-1
#    access_key: <from POKERFACE_REGISTRY_S3_ACCESS_KEY>
#    secret_key: <from POKERFACE_REGISTRY_S3_SECRET_KEY>
#    path_style: true
#    prefix: blobs
#    ca_file: /etc/ssl/internal-ca.pem
#    verify_tls: true
#    presign_ttl: 900

limits:
  max_body_bytes: 16777216
  max_header_bytes: 1048576
  read_timeout: 30
  idle_timeout: 5

# Optional; defaults to <data_dir>/registry.shutdown. scripts/run-registry.sh
# overrides it with POKERFACE_REGISTRY_SHUTDOWN_FILE.
# shutdown_file: ./data/registry.shutdown

# Bearer-token authentication (T2.14). Disabled by default; when enabled, a
# signing key and at least one account are required. Secrets can come from
# files (signing_key_file / password_file) instead of the YAML.
# auth:
#   enabled: true
#   realm: "https://registry.example.com/token"   # default: http://<listen>/token
#   service: "pokerface-registry"
#   issuer: "pokerface-registry"
#   token_ttl: 3600
#   signing_key_file: /etc/pokerface/signing-key
#   users:
#     - username: alice
#       password_file: /etc/pokerface/alice
